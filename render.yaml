services:
  - type: web
    name: livo-footwear-erp-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: LIVO_DEV_MODE
        value: "false"
      - key: ENVIRONMENT
        value: staging
      - key: AUTO_MIGRATE
        value: "true"
      - key: TRUSTED_PROXIES
        value: "127.0.0.1,::1"
