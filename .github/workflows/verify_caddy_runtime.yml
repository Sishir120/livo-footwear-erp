name: Verify Caddy Edge Runtime & Body Limit

'on':
  pull_request:
    paths:
      - 'Caddyfile'
      - 'docker-compose.yml'
      - 'scripts/caddy_synthetic_backend.py'
      - '.github/workflows/verify_caddy_runtime.yml'
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'Caddyfile'
      - 'docker-compose.yml'
      - 'scripts/caddy_synthetic_backend.py'
      - '.github/workflows/verify_caddy_runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-caddy-runtime:
    name: Validate Caddy Syntax & 10MB Request-Body Limit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect Pinned Caddy Image Reference & Version Resolution
        id: caddy-meta
        run: |
          COMPOSE_IMAGE=$(grep -E '^\s*image:\s*caddy:' docker-compose.yml | head -n 1 | awk '{print $2}')
          echo "Declared image in docker-compose.yml: ${COMPOSE_IMAGE}"
          echo "Note: '${COMPOSE_IMAGE}' is a mutable rolling tag (not an immutable sha256 digest)."

          echo "Pulling Caddy image..."
          docker pull "${COMPOSE_IMAGE}"

          CADDY_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${COMPOSE_IMAGE}" 2>/dev/null || echo "digest-unavailable")
          CADDY_VERSION=$(docker run --rm "${COMPOSE_IMAGE}" caddy version)

          echo "Pulling Client & Backend images for reproducible environment audit..."
          docker pull curlimages/curl:latest
          CURL_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' curlimages/curl:latest 2>/dev/null || echo "digest-unavailable")
          CURL_VERSION=$(docker run --rm curlimages/curl:latest --version 2>/dev/null | head -n 1)

          docker pull python:3.11-alpine
          PY_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' python:3.11-alpine 2>/dev/null || echo "digest-unavailable")
          PY_VERSION=$(docker run --rm python:3.11-alpine python --version 2>/dev/null)

          echo "=================================================="
          echo "Workflow Run ID:        ${{ github.run_id }}"
          echo "Workflow Run Attempt:   ${{ github.run_attempt }}"
          echo "Workflow Commit SHA:    ${{ github.sha }}"
          echo "Workflow Ref:           ${{ github.ref }}"
          echo "Caddy Image Reference:  ${COMPOSE_IMAGE}"
          echo "Caddy Image Digest:     ${CADDY_DIGEST}"
          echo "Caddy Resolved Version: ${CADDY_VERSION}"
          echo "Client Image Reference: curlimages/curl:latest"
          echo "Client Image Digest:    ${CURL_DIGEST}"
          echo "Client Version:         ${CURL_VERSION}"
          echo "Backend Image Ref:      python:3.11-alpine"
          echo "Backend Image Digest:   ${PY_DIGEST}"
          echo "Backend Version:        ${PY_VERSION}"
          echo "=================================================="

      - name: Validate Repository Caddyfile Syntax (Default DOMAIN)
        run: |
          COMPOSE_IMAGE=$(grep -E '^\s*image:\s*caddy:' docker-compose.yml | head -n 1 | awk '{print $2}')
          echo "Running 'caddy validate' with default DOMAIN (localhost)..."
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "${COMPOSE_IMAGE}" \
            caddy validate --config /etc/caddy/Caddyfile
          echo "Adapted Caddy JSON configuration:"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "${COMPOSE_IMAGE}" \
            caddy adapt --config /etc/caddy/Caddyfile --pretty

      - name: Validate Repository Caddyfile Syntax (HTTP Domain Override)
        run: |
          COMPOSE_IMAGE=$(grep -E '^\s*image:\s*caddy:' docker-compose.yml | head -n 1 | awk '{print $2}')
          echo "Running 'caddy validate' with DOMAIN=http://localhost..."
          docker run --rm \
            -e DOMAIN=http://localhost \
            -v "${GITHUB_WORKSPACE}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "${COMPOSE_IMAGE}" \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Execute Isolated Caddy Runtime Verification
        id: runtime-tests
        run: |
          set -euo pipefail

          COMPOSE_IMAGE=$(grep -E '^\s*image:\s*caddy:' docker-compose.yml | head -n 1 | awk '{print $2}')
          NET_NAME="caddy_edge_verify_net_${GITHUB_RUN_ID:-$$}"
          echo "Creating isolated Docker network: ${NET_NAME}"
          docker network create "${NET_NAME}"

          ORIGINAL_EXIT=0
          cleanup() {
            ORIGINAL_EXIT=$?
            echo "Executing in-script cleanup (exit code: ${ORIGINAL_EXIT})..."
            docker rm -f caddy_proxy synthetic_backend 2>/dev/null || true
            docker network rm "${NET_NAME}" 2>/dev/null || true
            exit "${ORIGINAL_EXIT}"
          }
          trap cleanup EXIT

          echo "Starting synthetic backend (dual port 8000/3000)..."
          docker run -d \
            --name synthetic_backend \
            --network "${NET_NAME}" \
            --network-alias backend \
            --network-alias frontend \
            -v "${GITHUB_WORKSPACE}/scripts/caddy_synthetic_backend.py:/app/backend.py:ro" \
            python:3.11-alpine \
            python /app/backend.py

          echo "Waiting for synthetic backend readiness on port 8000..."
          BACKEND_READY=false
          for i in $(seq 1 15); do
            if docker run --rm --network "${NET_NAME}" curlimages/curl:latest -s http://backend:8000/health | grep -q "healthy"; then
              echo "Synthetic backend is healthy."
              BACKEND_READY=true
              break
            fi
            sleep 1
          done
          if [ "${BACKEND_READY}" != "true" ]; then
            echo "::error::Synthetic backend failed to become healthy within 15 seconds."
            docker logs synthetic_backend
            exit 1
          fi

          echo "Starting Caddy container with repository Caddyfile..."
          docker run -d \
            --name caddy_proxy \
            --network "${NET_NAME}" \
            --network-alias caddy \
            -e DOMAIN=http://caddy \
            -v "${GITHUB_WORKSPACE}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "${COMPOSE_IMAGE}" \
            caddy run --config /etc/caddy/Caddyfile

          echo "Waiting for Caddy proxy readiness..."
          CADDY_READY=false
          PROBE_STATUS=""
          for i in $(seq 1 15); do
            PROBE_STATUS=$(docker run --rm --network "${NET_NAME}" curlimages/curl:latest -s -o /dev/null -w "%{http_code}" http://caddy/health/ || true)
            if [ "${PROBE_STATUS}" = "200" ]; then
              echo "Caddy proxy is ready (HTTP 200 on /health/)."
              CADDY_READY=true
              break
            fi
            echo "Caddy readiness attempt #${i}/15 returned HTTP '${PROBE_STATUS}'; retrying in 1s..."
            sleep 1
          done
          if [ "${CADDY_READY}" != "true" ]; then
            echo "::error::Caddy failed to respond with HTTP 200 within 15 seconds (last status: '${PROBE_STATUS:-empty}')."
            docker logs caddy_proxy
            exit 1
          fi

          echo "=== Caddy Initial Startup Logs ==="
          docker logs caddy_proxy

          mkdir -p /tmp/caddy_test
          chmod 777 /tmp/caddy_test
          dd if=/dev/urandom of=/tmp/caddy_test/payload_1mib.bin bs=1M count=1 2>/dev/null
          PAYLOAD_1MIB_BYTES=$(stat -c%s /tmp/caddy_test/payload_1mib.bin)
          echo "Created 1 MiB test payload: ${PAYLOAD_1MIB_BYTES} bytes"

          dd if=/dev/urandom of=/tmp/caddy_test/payload_11mib.bin bs=1M count=11 2>/dev/null
          PAYLOAD_11MIB_BYTES=$(stat -c%s /tmp/caddy_test/payload_11mib.bin)
          echo "Created 11 MiB test payload: ${PAYLOAD_11MIB_BYTES} bytes"

          # Tracking test outcomes across all cases
          CASE_A_PASSED=false
          CASE_B_PASSED=false
          CASE_C_PASSED=false
          CASE_D_PASSED=false
          CASE_E_PASSED=false
          CASE_F_PASSED=false

          # -------------------------------------------------------------
          # TEST CASE A: Ordinary Request Below Configured Limit (1 MiB)
          # -------------------------------------------------------------
          echo ""
          echo "=========================================================="
          echo "EXECUTING TEST CASE A: Ordinary Request (1 MiB <= 10MB)"
          echo "=========================================================="

          rm -f /tmp/caddy_test/headers_a.txt /tmp/caddy_test/resp_a.txt /tmp/caddy_test/curl_err_a.txt

          CURL_EXIT_A=0
          HTTP_STATUS_A=$(docker run --rm \
            --network "${NET_NAME}" \
            -v /tmp/caddy_test:/data \
            curlimages/curl:latest \
            -s -S -o /data/resp_a.txt -D /data/headers_a.txt -w "%{http_code}" \
            -X POST http://caddy/api/test_ordinary \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@/data/payload_1mib.bin" 2>/tmp/caddy_test/curl_err_a.txt) || CURL_EXIT_A=$?

          echo "Case A curl exit code: ${CURL_EXIT_A}"
          echo "Case A HTTP Status received from Caddy: '${HTTP_STATUS_A}'"
          if [ "${CURL_EXIT_A}" -eq 0 ] && [ "${HTTP_STATUS_A}" = "200" ]; then
            BACKEND_INSPECT_A=$(docker run --rm --network "${NET_NAME}" curlimages/curl:latest -s -S -f http://backend:8000/inspect/requests || true)
            echo "Synthetic Backend Inspection after Case A: ${BACKEND_INSPECT_A}"
            if echo "${BACKEND_INSPECT_A}" | python3 "${GITHUB_WORKSPACE}/scripts/caddy_synthetic_backend.py" --validate-inspect 1 "${PAYLOAD_1MIB_BYTES}"; then
              echo "Case A PASSED: Ordinary request successfully proxied (${PAYLOAD_1MIB_BYTES} bytes) and verified by synthetic backend inspection validator."
              CASE_A_PASSED=true
            else
              echo "::error::Case A failed! Synthetic backend inspection validation failed."
            fi
          else
            echo "::error::Case A failed! Expected clean curl exit (0) and HTTP 200, got exit code ${CURL_EXIT_A}, HTTP status '${HTTP_STATUS_A}'"
            echo "=== Case A Curl Stderr ==="
            cat /tmp/caddy_test/curl_err_a.txt 2>/dev/null || true
            echo "=== Case A Response Body ==="
            cat /tmp/caddy_test/resp_a.txt 2>/dev/null || true
          fi

          # -------------------------------------------------------------
          # TEST CASE B: Oversized Request Exceeding Limit (11 MiB)
          # -------------------------------------------------------------
          echo ""
          echo "=========================================================="
          echo "EXECUTING TEST CASE B: Oversized Request (11 MiB > 10MB)"
          echo "=========================================================="

          rm -f /tmp/caddy_test/headers_b.txt /tmp/caddy_test/resp_b.txt /tmp/caddy_test/curl_err_b.txt

          CURL_EXIT_B=0
          HTTP_STATUS_B=$(docker run --rm \
            --network "${NET_NAME}" \
            -v /tmp/caddy_test:/data \
            curlimages/curl:latest \
            -s -S -o /data/resp_b.txt -D /data/headers_b.txt -w "%{http_code}" \
            -X POST http://caddy/api/test_oversized \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@/data/payload_11mib.bin" 2>/tmp/caddy_test/curl_err_b.txt) || CURL_EXIT_B=$?

          echo "Case B curl exit code: ${CURL_EXIT_B}"
          echo "Case B HTTP Status received from Caddy: '${HTTP_STATUS_B}'"
          echo "Case B Response Headers:"
          cat /tmp/caddy_test/headers_b.txt 2>/dev/null || echo "(no headers captured)"

          # Strictly require clean curl exit (0) and exact HTTP status 413
          if [ "${CURL_EXIT_B}" -eq 0 ] && [ "${HTTP_STATUS_B:-}" = "413" ]; then
            echo "Case B verified: clean curl exit (code 0) and exact HTTP status 413 received from Caddy."
            echo "Polling synthetic backend across bounded settling period (5 iterations, 1s interval)..."
            POLL_PASS_COUNT=0
            for attempt in $(seq 1 5); do
              sleep 1
              echo "--- Settling poll #${attempt}/5 ---"
              BACKEND_DATA=$(docker run --rm --network "${NET_NAME}" curlimages/curl:latest -s -S -f http://backend:8000/inspect/requests || true)
              echo "Inspection response #${attempt}: ${BACKEND_DATA}"
              if echo "${BACKEND_DATA}" | python3 "${GITHUB_WORKSPACE}/scripts/caddy_synthetic_backend.py" --validate-inspect 1 "${PAYLOAD_1MIB_BYTES}"; then
                POLL_PASS_COUNT=$((POLL_PASS_COUNT + 1))
                echo "Settling poll #${attempt}/5 passed (valid JSON structure, exact count == 1, and Case A payload unchanged at ${PAYLOAD_1MIB_BYTES} bytes)."
              else
                echo "Settling poll #${attempt}/5 failed inspection assertion."
              fi
            done

            if [ "${POLL_PASS_COUNT}" -eq 5 ]; then
              echo "Case B PASSED: Bounded application-layer observation verified across all 5 polling iterations (each poll verified valid JSON and count == 1; 0 additional requests forwarded to backend during the settling window). Note: This confirms bounded application-layer settling observation under isolated test conditions, not an unlimited guarantee about future network traffic."
              CASE_B_PASSED=true
            else
              echo "::error::Case B failed! Required 5 of 5 successful settling polls, but only ${POLL_PASS_COUNT} completed."
            fi
          else
            echo "::error::Case B failed! Expected clean curl exit (0) and HTTP 413 from Caddy. Got curl exit code: ${CURL_EXIT_B}, HTTP status: '${HTTP_STATUS_B}'"
            echo "=== Curl Stderr ==="
            cat /tmp/caddy_test/curl_err_b.txt 2>/dev/null || true
            echo "=== Response Body ==="
            cat /tmp/caddy_test/resp_b.txt 2>/dev/null || true
          fi

          # Capture backend state after Case B for diagnostic evidence and Case C baseline
          BACKEND_AFTER_B=$(docker run --rm --network "${NET_NAME}" curlimages/curl:latest -s -S -f http://backend:8000/inspect/requests || true)
          COUNT_AFTER_B=$(echo "${BACKEND_AFTER_B}" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('count', 1))" 2>/dev/null || echo "1")
          echo "Backend state after Case B: count=${COUNT_AFTER_B}, data=${BACKEND_AFTER_B}"

          # -------------------------------------------------------------
          # TEST CASE C: Chunked Transfer-Encoding Edge Rejection (Contract B)
          # -------------------------------------------------------------
          echo ""
          echo "=========================================================="
          echo "EXECUTING TEST CASE C: Chunked Request (Strict Edge Rejection: Contract B)"
          echo "=========================================================="

          rm -f /tmp/caddy_test/headers_c.txt /tmp/caddy_test/resp_c.txt /tmp/caddy_test/curl_err_c.txt

          CURL_EXIT_C=0
          HTTP_STATUS_C=$(docker run --rm \
            --network "${NET_NAME}" \
            -v /tmp/caddy_test:/data \
            curlimages/curl:latest \
            -s -S -o /data/resp_c.txt -D /data/headers_c.txt -w "%{http_code}" \
            -X POST http://caddy/api/test_streaming_oversized \
            -H "Transfer-Encoding: chunked" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@/data/payload_11mib.bin" 2>/tmp/caddy_test/curl_err_c.txt) || CURL_EXIT_C=$?

          echo "Case C curl exit code: ${CURL_EXIT_C}"
          echo "Case C HTTP Status received from Caddy: '${HTTP_STATUS_C}'"
          echo "Case C Response Headers:"
          cat /tmp/caddy_test/headers_c.txt 2>/dev/null || echo "(no headers captured)"

          # Under Contract B, Caddy rejects chunked requests at the edge with HTTP 411 Length Required (or 413)
          if [ "${HTTP_STATUS_C}" = "411" ]; then
            echo "Case C Client Result: Received explicit HTTP 411 Length Required from Caddy (Contract B edge rejection)."
          elif [ "${HTTP_STATUS_C}" = "413" ]; then
            echo "Case C Client Result: Received explicit HTTP 413 from Caddy."
          else
            echo "::error::Case C client outcome failed! Expected HTTP 411 from Caddy edge rejection. Got HTTP status: '${HTTP_STATUS_C}', curl exit: ${CURL_EXIT_C}"
            cat /tmp/caddy_test/curl_err_c.txt 2>/dev/null || true
          fi

          echo "Inspecting synthetic backend observation for Case C..."
          BACKEND_DATA_C=$(docker run --rm --network "${NET_NAME}" curlimages/curl:latest -s -S -f http://backend:8000/inspect/requests || true)
          echo "Inspection response after Case C: ${BACKEND_DATA_C}"

          # Strictly verify Contract B: request rejected at edge, 0 requests forwarded to backend
          if echo "${BACKEND_DATA_C}" | python3 "${GITHUB_WORKSPACE}/scripts/caddy_synthetic_backend.py" --validate-case-c --client-status "${HTTP_STATUS_C}" --curl-exit "${CURL_EXIT_C}" --case-c-path "/api/test_streaming_oversized" --max-bytes 10000000 --expected-prior-requests "${COUNT_AFTER_B:-1}"; then
            echo "Case C PASSED: Verified under strict Contract B edge rejection (0 requests and 0 bytes exposed to backend)."
            CASE_C_PASSED=true
          else
            echo "::error::Case C failed validation under strict Contract B edge rejection."
          fi

          # -------------------------------------------------------------
          # TEST CASE D: Mixed-Case Transfer-Encoding (ChUnKeD)
          # -------------------------------------------------------------
          echo ""
          echo "=========================================================="
          echo "EXECUTING TEST CASE D: Mixed-Case Transfer-Encoding (ChUnKeD)"
          echo "=========================================================="

          rm -f /tmp/caddy_test/headers_d.txt /tmp/caddy_test/resp_d.txt /tmp/caddy_test/curl_err_d.txt

          CURL_EXIT_D=0
          HTTP_STATUS_D=$(docker run --rm \
            --network "${NET_NAME}" \
            -v /tmp/caddy_test:/data \
            curlimages/curl:latest \
            -s -S -o /data/resp_d.txt -D /data/headers_d.txt -w "%{http_code}" \
            -X POST http://caddy/api/test_mixed_case_chunked \
            -H "Transfer-Encoding: ChUnKeD" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@/data/payload_11mib.bin" 2>/tmp/caddy_test/curl_err_d.txt) || CURL_EXIT_D=$?

          echo "Case D curl exit code: ${CURL_EXIT_D}"
          echo "Case D HTTP Status received from Caddy: '${HTTP_STATUS_D}'"
          echo "Case D Response Headers:"
          cat /tmp/caddy_test/headers_d.txt 2>/dev/null || echo "(no headers captured)"

          if [ "${HTTP_STATUS_D}" = "411" ] || [ "${HTTP_STATUS_D}" = "413" ]; then
            echo "Case D Client Result: Received HTTP ${HTTP_STATUS_D} from Caddy edge rejection for mixed-case chunked header."
          else
            echo "::error::Case D client outcome failed! Expected HTTP 411 or 413 from Caddy edge rejection. Got HTTP status: '${HTTP_STATUS_D}', curl exit: ${CURL_EXIT_D}"
            cat /tmp/caddy_test/curl_err_d.txt 2>/dev/null || true
          fi

          echo "Inspecting synthetic backend observation for Case D..."
          BACKEND_DATA_D=$(docker run --rm --network "${NET_NAME}" curlimages/curl:latest -s -S -f http://backend:8000/inspect/requests || true)
          echo "Inspection response after Case D: ${BACKEND_DATA_D}"

          # Verify 0 requests reached backend (count must match prior count)
          if echo "${BACKEND_DATA_D}" | python3 "${GITHUB_WORKSPACE}/scripts/caddy_synthetic_backend.py" --validate-case-c --client-status "${HTTP_STATUS_D}" --curl-exit "${CURL_EXIT_D}" --case-c-path "/api/test_mixed_case_chunked" --max-bytes 10000000 --expected-prior-requests "${COUNT_AFTER_B:-1}"; then
            echo "Case D PASSED: Mixed-case chunked request strictly rejected at edge (0 requests/bytes to backend)."
            CASE_D_PASSED=true
          else
            echo "::error::Case D failed validation under strict Contract B edge rejection."
          fi

          # -------------------------------------------------------------
          # TEST CASE E: Conflicting Framing (Content-Length + Transfer-Encoding)
          # -------------------------------------------------------------
          echo ""
          echo "=========================================================="
          echo "EXECUTING TEST CASE E: Conflicting Framing (CL + TE)"
          echo "=========================================================="

          rm -f /tmp/caddy_test/headers_e.txt /tmp/caddy_test/resp_e.txt /tmp/caddy_test/curl_err_e.txt

          CURL_EXIT_E=0
          HTTP_STATUS_E=$(docker run --rm \
            --network "${NET_NAME}" \
            -v /tmp/caddy_test:/data \
            curlimages/curl:latest \
            -s -S -o /data/resp_e.txt -D /data/headers_e.txt -w "%{http_code}" \
            -X POST http://caddy/api/test_conflicting_framing \
            -H "Content-Length: 1048576" \
            -H "Transfer-Encoding: chunked" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@/data/payload_1mib.bin" 2>/tmp/caddy_test/curl_err_e.txt) || CURL_EXIT_E=$?

          echo "Case E curl exit code: ${CURL_EXIT_E}"
          echo "Case E HTTP Status received from Caddy: '${HTTP_STATUS_E}'"
          echo "Case E Response Headers:"
          cat /tmp/caddy_test/headers_e.txt 2>/dev/null || echo "(no headers captured)"

          # Under RFC 9112 §6.1, Go net/http rejects ambiguous framing with HTTP 400 Bad Request,
          # or Caddy matches @chunked and returns 411 Length Required.
          if [ "${HTTP_STATUS_E}" = "400" ] || [ "${HTTP_STATUS_E}" = "411" ] || [ "${HTTP_STATUS_E}" = "413" ]; then
            echo "Case E Client Result: Received safe rejection HTTP ${HTTP_STATUS_E} from server for conflicting framing."
          else
            echo "::error::Case E client outcome failed! Expected HTTP 400 or 411 from safe server rejection. Got HTTP status: '${HTTP_STATUS_E}', curl exit: ${CURL_EXIT_E}"
            cat /tmp/caddy_test/curl_err_e.txt 2>/dev/null || true
          fi

          echo "Inspecting synthetic backend observation for Case E..."
          BACKEND_DATA_E=$(docker run --rm --network "${NET_NAME}" curlimages/curl:latest -s -S -f http://backend:8000/inspect/requests || true)
          echo "Inspection response after Case E: ${BACKEND_DATA_E}"

          if echo "${BACKEND_DATA_E}" | python3 "${GITHUB_WORKSPACE}/scripts/caddy_synthetic_backend.py" --validate-case-c --client-status "${HTTP_STATUS_E}" --curl-exit "${CURL_EXIT_E}" --case-c-path "/api/test_conflicting_framing" --max-bytes 10000000 --expected-prior-requests "${COUNT_AFTER_B:-1}"; then
            echo "Case E PASSED: Conflicting framing safely rejected (0 requests/bytes to backend)."
            CASE_E_PASSED=true
          else
            echo "::error::Case E failed validation: conflicting framing reached backend or corrupted state."
          fi

          # -------------------------------------------------------------
          # TEST CASE F: HTTP/2 Cleartext Protocol Evaluation
          # -------------------------------------------------------------
          echo ""
          echo "=========================================================="
          echo "EXECUTING TEST CASE F: HTTP/2 Protocol Evaluation"
          echo "=========================================================="

          # Document protocol framing behavior:
          # RFC 9113 §8.2.2 strictly forbids Transfer-Encoding in HTTP/2.
          # Caddy on cleartext HTTP defaults to HTTP/1.1 (h2c disabled unless 'protocols h1 h2c' declared).
          # Probe with curl --http2-prior-knowledge to verify safe protocol handling on cleartext listener.
          rm -f /tmp/caddy_test/headers_f.txt /tmp/caddy_test/resp_f.txt /tmp/caddy_test/curl_err_f.txt

          CURL_EXIT_F=0
          HTTP_STATUS_F=$(docker run --rm \
            --network "${NET_NAME}" \
            -v /tmp/caddy_test:/data \
            curlimages/curl:latest \
            -s -S -o /data/resp_f.txt -D /data/headers_f.txt -w "%{http_code}" \
            --http2-prior-knowledge \
            -X POST http://caddy/api/test_h2_probe \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@/data/payload_1mib.bin" 2>/tmp/caddy_test/curl_err_f.txt) || CURL_EXIT_F=$?

          echo "Case F curl exit code: ${CURL_EXIT_F}"
          echo "Case F HTTP Status observed: '${HTTP_STATUS_F}'"
          echo "=== Case F Stderr / Protocol Note ==="
          cat /tmp/caddy_test/curl_err_f.txt 2>/dev/null || true

          # On standard cleartext HTTP listener without h2c enabled, Caddy rejects h2 preface or returns HTTP 400 / connection close
          # Backend MUST receive 0 requests from failed h2 preface
          BACKEND_DATA_F=$(docker run --rm --network "${NET_NAME}" curlimages/curl:latest -s -S -f http://backend:8000/inspect/requests || true)
          echo "Inspection response after Case F: ${BACKEND_DATA_F}"

          COUNT_AFTER_F=$(echo "${BACKEND_DATA_F}" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('count', 1))" 2>/dev/null || echo "1")
          if [ "${COUNT_AFTER_F}" -eq "${COUNT_AFTER_B:-1}" ]; then
            echo "Case F PASSED: Cleartext HTTP/2 probe verified; 0 requests exposed to backend (count remained ${COUNT_AFTER_B:-1})."
            CASE_F_PASSED=true
          else
            echo "::error::Case F failed! Backend request count changed: count=${COUNT_AFTER_F}, expected=${COUNT_AFTER_B:-1}"
          fi

          # -------------------------------------------------------------
          # TEST SUMMARY & FINAL LOG CAPTURE
          # -------------------------------------------------------------
          echo ""
          echo "=========================================================="
          echo "TEST SUMMARY & EVIDENCE CAPTURE"
          echo "=========================================================="
          echo "Case A Result: ${CASE_A_PASSED}"
          echo "Case B Result: ${CASE_B_PASSED}"
          echo "Case C Result: ${CASE_C_PASSED}"
          echo "Case D Result: ${CASE_D_PASSED}"
          echo "Case E Result: ${CASE_E_PASSED}"
          echo "Case F Result: ${CASE_F_PASSED}"
          echo "=== Final Caddy Access Logs ==="
          docker logs caddy_proxy 2>/dev/null || true

          if [ "${CASE_A_PASSED}" != "true" ] || [ "${CASE_B_PASSED}" != "true" ] || [ "${CASE_C_PASSED}" != "true" ] || \
             [ "${CASE_D_PASSED}" != "true" ] || [ "${CASE_E_PASSED}" != "true" ] || [ "${CASE_F_PASSED}" != "true" ]; then
            echo "::error::One or more test cases failed! (Case A: ${CASE_A_PASSED}, Case B: ${CASE_B_PASSED}, Case C: ${CASE_C_PASSED}, Case D: ${CASE_D_PASSED}, Case E: ${CASE_E_PASSED}, Case F: ${CASE_F_PASSED})"
            exit 1
          fi
          echo "All Caddy runtime test cases (A through F) completed successfully."

      - name: Teardown and Cleanup Docker Resources
        if: always()
        run: |
          echo "Executing post-run container and network cleanup..."
          NET_NAME="caddy_edge_verify_net_${GITHUB_RUN_ID:-$$}"
          docker rm -f caddy_proxy synthetic_backend 2>/dev/null || true
          docker network rm "${NET_NAME}" 2>/dev/null || true
